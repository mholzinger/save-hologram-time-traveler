# The patcher players download: the code-only 3DS app built with devkitPro, then the one-file patcher
# (window + command line) for Windows, Linux and macOS, each started once headless before it ships.
# A v* tag publishes a GitHub Release with all of it; a manual run (Actions > Release > Run workflow)
# only builds and keeps the files as run artifacts. Modelled on intv2convert's release workflow.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    name: 3DS app (code only)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v7
      # No build/art here, so the app carries libctru's placeholder icon; the patcher puts ours in.
      - run: make -C port/3ds
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: |
            port/3ds/timetrv3ds.3dsx
            port/3ds/timetrv3ds.elf

  patcher:
    name: Patcher (${{ matrix.asset }})
    needs: app
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
          - os: ubuntu-22.04 # an older glibc, so the binary runs on more Linux installs
            asset: linux-x64
          - os: macos-latest
            asset: macos-arm64
          - os: macos-15-intel # the Intel image that replaces macos-13
            asset: macos-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: app
          path: app
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-patcher.txt
      - run: python tools/build_patcher.py app

      - name: Self-test (Linux, no display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a dist/timetrv-patcher --selftest
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: dist/timetrv-patcher.app/Contents/MacOS/timetrv-patcher --selftest
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: cmd # cmd, not PowerShell, for a plain exit code (intv2convert's lesson)
        run: dist\timetrv-patcher.exe --selftest

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/timetrv-patcher.exe -DestinationPath timetrv-patcher-${{ matrix.asset }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf timetrv-patcher-${{ matrix.asset }}.tar.gz -C dist timetrv-patcher
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/timetrv-patcher.app timetrv-patcher-${{ matrix.asset }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: timetrv-patcher-${{ matrix.asset }}
          path: timetrv-patcher-${{ matrix.asset }}.*

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: patcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: timetrv-patcher-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a tag with a hyphen (v0.1.0-beta.1) is published as a pre-release
          pre=""; case "${{ github.ref_name }}" in *-*) pre="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" $pre \
            --title "Time Traveler 3DS patcher ${{ github.ref_name }}" \
            --generate-notes \
            dist/*

  # The same files go to itch.io, one channel per platform (itch tags the platform from the channel
  # name). Each archive is pushed as-is inside its own folder, so the Mac .app keeps its permissions.
  # Skips until BUTLER_API_KEY is set: gh secret set BUTLER_API_KEY (itch.io/user/settings/api-keys).
  itch:
    name: itch.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: patcher
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_GAME: paisleyboxers/save-time-traveler
    steps:
      - uses: actions/download-artifact@v8
        if: env.BUTLER_API_KEY != ''
        with:
          path: dist
          pattern: timetrv-patcher-*
          merge-multiple: true
      - name: Push
        if: env.BUTLER_API_KEY != ''
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -qq /tmp/butler.zip -d /tmp/butler-bin && chmod +x /tmp/butler-bin/butler
          for asset in windows-x64 linux-x64 macos-arm64 macos-x64; do
            mkdir -p "push/$asset" && mv dist/timetrv-patcher-$asset.* "push/$asset/"
            # channel names carry the target (3ds-...), so later patchers (saturn-..., segacd-...) share the page
            /tmp/butler-bin/butler push "push/$asset" "$ITCH_GAME:3ds-$asset" \
              --userversion "${{ github.ref_name }}" --if-changed
          done
          /tmp/butler-bin/butler status "$ITCH_GAME"
